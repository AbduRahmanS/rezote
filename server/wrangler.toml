# Rezote sync server on Cloudflare Workers. See docs/deploy.md.
name = "rezote-sync"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "rezote"
# Replace with the ID printed by `npx wrangler d1 create rezote`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Comma-separated app origins. Replace with your Cloudflare Pages URLs before deploying.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174"

# 60 write requests per minute per IP, per Cloudflare location.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
